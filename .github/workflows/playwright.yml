name: Playwright Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright and Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --update-snapshots --reporter=html

      # TEMP: upload regenerated baselines so they can be committed locally
      - name: Upload regenerated snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-snapshots
          path: tests/*.spec.ts-snapshots/*.png

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/