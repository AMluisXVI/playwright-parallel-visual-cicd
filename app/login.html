<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 360px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1a202c;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input:focus {
      outline: 2px solid #3182ce;
      border-color: transparent;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #3182ce;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    button:hover { background: #2b6cb0; }
    .message {
      margin-top: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .message.success { background: #c6f6d5; color: #22543d; display: block; }
    .message.error { background: #fed7d7; color: #742a2a; display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Log In</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Log In</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const USERS = { admin: '1234' };

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMessage('Please fill in both fields', 'error');
        return;
      }

      if (USERS[username] && USERS[username] === password) {
        showMessage('successful entry', 'success');
        setTimeout(() => {
          window.location.href = 'welcome.html?user=' + encodeURIComponent(username);
        }, 1200);
      } else {
        showMessage('invalid credentials', 'error');
      }
    });

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }
  </script>
</body>
</html>
